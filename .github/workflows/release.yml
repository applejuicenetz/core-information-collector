name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: amd64
            type: dmg
          - runner: macos-15
            platform: macos
            arch: aarch64
            type: dmg
          - runner: windows-2025
            platform: windows
            arch: amd64
            type: exe
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
            type: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - uses: actions/setup-python@v7
        if: matrix.platform == 'windows'
        with:
          python-version: '3.x'

      - name: Install WiX 3 for JDK 21 jpackage
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314.zip'
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') {
            throw 'WiX archive checksum mismatch'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $archive -DestinationPath $tools
          $tools >> $env:GITHUB_PATH

      - name: Build JAR and native installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_TYPE: ${{ matrix.type }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          fi
          mvn -B package
          version="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p target/jpackage-input target/jpackage-output
          cp target/AJCollector.jar target/jpackage-input/
          package_name=AJCollector
          if [[ "$PACKAGE_PLATFORM" == windows ]]; then
            package_name="appleJuice Collector"
          fi
          options=(
            --type "$PACKAGE_TYPE"
            --name "$package_name"
            --app-version "$version"
            --vendor appleJuiceNETZ
            --input target/jpackage-input
            --main-jar AJCollector.jar
            --main-class de.applejuicenet.collector.Runner
            --add-modules java.desktop,java.management,java.naming,java.sql,java.xml,jdk.crypto.ec,jdk.unsupported
            --java-options --enable-preview
            --java-options --enable-native-access=ALL-UNNAMED
            --dest target/jpackage-output
          )
          if [[ "$PACKAGE_PLATFORM" == macos ]]; then
            options+=(--icon assets/mac/AJCollector.icns --mac-package-identifier de.applejuicenet.collector --resource-dir assets/mac)
          else
            python scripts/windows_installer.py --resource-dir target/jpackage-resources
            options+=(
              --resource-dir target/jpackage-resources
              --icon assets/windows/AJCollector.ico
              --description "appleJuice Collector"
              --copyright appleJuiceNETZ
              --about-url https://applejuicenetz.github.io
              --win-help-url https://applejuicenetz.github.io/faq/
              --install-dir appleJuiceNETZ/Collector
              --win-dir-chooser
              --win-menu
              --win-menu-group appleJuiceNETZ
              --win-shortcut
              --win-upgrade-uuid 6119ffb5-f01b-4162-ab46-a62d5dd16f37
            )
          fi
          jpackage "${options[@]}"
          mv "target/jpackage-output/${package_name}-${version}.${PACKAGE_TYPE}" "target/AJCollector-${PACKAGE_PLATFORM}-${PACKAGE_ARCH}.${PACKAGE_TYPE}"

      - name: Test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python scripts/test_windows_installer.py target/AJCollector-windows-${{ matrix.arch }}.exe

      - name: Verify macOS network usage description
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mountpoint="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "target/AJCollector-macos-${PACKAGE_ARCH}.dmg"
          trap 'hdiutil detach "$mountpoint"' EXIT
          plist="$mountpoint/AJCollector.app/Contents/Info.plist"
          plutil -lint "$plist"
          test -n "$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$plist")"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/AJCollector-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.type }}
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            package-arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            package-arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN
      - name: Install Flatpak builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build JAR and Flatpak bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLATPAK_ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package-arch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          fi
          mvn -B package
          version="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          release_date="$(date -u +%F)"
          sed -i -E "s|<release version=\"[^\"]+\" type=\"stable\" date=\"[^\"]+\"/>|<release version=\"$version\" type=\"stable\" date=\"$release_date\"/>|" \
            flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml
          flatpak-builder \
            --arch="$FLATPAK_ARCH" \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=target/flatpak-repo \
            --default-branch=stable \
            target/flatpak-build \
            flatpak/io.github.applejuicenetz.collector.yaml
          flatpak build-bundle \
            --arch="$FLATPAK_ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            target/flatpak-repo \
            "target/AJCollector-linux-${PACKAGE_ARCH}.flatpak" \
            io.github.applejuicenetz.collector stable
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.package-arch }}
          path: target/AJCollector-linux-${{ matrix.package-arch }}.flatpak
          if-no-files-found: error

  archive32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86
            file: bellsoft-jre21.0.12.1+1-windows-i586.zip
            sha256: 5dfc687e12cc9d00a55542cdf9eb1e8b7abb26b0bf43ea929d49d9f0be6106e4
          - platform: linux
            arch: x86
            file: bellsoft-jre21.0.12.1+1-linux-i586.tar.gz
            sha256: 386c795617217ace46b9acb1ba1a40c604b8c753d9c121972a496a62d95cd305
          - platform: linux
            arch: armhf
            file: bellsoft-jre21.0.12.1+1-linux-arm32-vfp-hflt.tar.gz
            sha256: 61b1a07a4caeaa68e75a7b5f4a599a8411ad26406e21a3f684a547a38af0a0a5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build JAR and bundled 32-bit archive
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_FILE: ${{ matrix.file }}
          RUNTIME_SHA256: ${{ matrix.sha256 }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          fi
          mvn -B package
          python -m unittest discover -s scripts -p 'test_archive.py'
          mkdir -p target/runtime32
          curl --fail --location --retry 3 "https://github.com/bell-sw/Liberica/releases/download/21.0.12.1%2B1/${RUNTIME_FILE//+/%2B}" -o "target/$RUNTIME_FILE"
          printf '%s  %s\n' "$RUNTIME_SHA256" "target/$RUNTIME_FILE" | sha256sum --check -
          if [[ "$RUNTIME_FILE" == *.zip ]]; then
            unzip -q "target/$RUNTIME_FILE" -d target/runtime32
          else
            tar -xf "target/$RUNTIME_FILE" -C target/runtime32
          fi
          python scripts/archive.py --jar target/AJCollector.jar --runtime target/runtime32/jre-21.0.12.1 --platform "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: archive32-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/AJCollector-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    needs: [package, flatpak, archive32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: target
      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          merge-multiple: true
          path: target
      - uses: actions/download-artifact@v8
        with:
          pattern: archive32-*
          merge-multiple: true
          path: target
      - name: Check all packages
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            AJCollector-macos-amd64.dmg \
            AJCollector-macos-aarch64.dmg \
            AJCollector-windows-amd64.exe \
            AJCollector-windows-aarch64.exe \
            AJCollector-linux-amd64.flatpak \
            AJCollector-linux-aarch64.flatpak \
            AJCollector-windows-x86.zip \
            AJCollector-linux-x86.tar.gz \
            AJCollector-linux-armhf.tar.gz; do
            test -s "target/$file"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: AJCollector-packages
          path: |
            target/*.dmg
            target/*.exe
            target/*.flatpak
            target/AJCollector-*.tar.gz
            target/AJCollector-windows-x86.zip
          if-no-files-found: error
      - name: Publish de.applejuicenet.core-information-collector to GitHub Packages
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          coordinates="$(mvn -q help:evaluate -Dexpression=project.groupId -DforceStdout):$(mvn -q help:evaluate -Dexpression=project.artifactId -DforceStdout)"
          if [[ "$coordinates" != de.applejuicenet:core-information-collector ]]; then
            echo "::error::Unexpected Maven coordinates: $coordinates"
            exit 1
          fi
          mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          mvn -B deploy
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: aktuelles Changelog befindet sich [hier](https://github.com/applejuicenetz/collector/blob/${{ github.ref_name }}/CHANGELOG.md#changelog)
          fail_on_unmatched_files: true
          files: |
            target/AJCollector.jar
            target/AJCollector-macos-amd64.dmg
            target/AJCollector-macos-aarch64.dmg
            target/AJCollector-windows-amd64.exe
            target/AJCollector-windows-aarch64.exe
            target/AJCollector-linux-amd64.flatpak
            target/AJCollector-linux-aarch64.flatpak
            target/AJCollector-windows-x86.zip
            target/AJCollector-linux-x86.tar.gz
            target/AJCollector-linux-armhf.tar.gz

  update-main:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN
      - name: Commit released version to main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::warning::Release commit is not on main; skipping version update"
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- pom.xml flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml; then
            echo "::warning::Release metadata changed on main since this tag; skipping version update"
            exit 0
          fi
          mvn -B versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
          sed -i -E "s|<release version=\"[^\"]+\" type=\"stable\" date=\"[^\"]+\"/>|<release version=\"$version\" type=\"stable\" date=\"$(date -u +%F)\"/>|" \
            flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml
          if git diff --quiet -- pom.xml flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml; then
            echo "main already contains version $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml
          git commit -m "Release $version"
          git push origin HEAD:main

  notify-flatpak:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger flatpak repository sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_DISPATCH_TOKEN }}
        run: gh api repos/applejuicenetz/flatpak/dispatches -f event_type=flatpak-release
