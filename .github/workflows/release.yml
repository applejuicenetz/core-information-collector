name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-source:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main

  test:
    needs: release-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install window system headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go vet ./...
      - run: go test -race -timeout 300s ./...

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, file: AJCollector-macos-amd64.dmg}
          - {runner: macos-15, goos: darwin, goarch: arm64, file: AJCollector-macos-aarch64.dmg}
          - {runner: windows-2025, goos: windows, goarch: amd64, file: AJCollector-windows-amd64.exe}
          - {runner: windows-11-arm, goos: windows, goarch: arm64, file: AJCollector-windows-aarch64.exe}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Inno Setup
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco upgrade innosetup --yes --no-progress
      - name: Install ARM64 C compiler
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $release = '20261020'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/llvm-mingw-$release-ucrt-aarch64.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath "$env:RUNNER_TEMP"
          $bin = "$env:RUNNER_TEMP\llvm-mingw-$release-ucrt-aarch64\bin"
          "$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "CC=$bin\aarch64-w64-mingw32-clang.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CXX=$bin\aarch64-w64-mingw32-clang++.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: bash packaging/package.sh
      - name: Verify macOS network usage description
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          mountpoint="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "dist/assets/$FILE"
          trap 'hdiutil detach "$mountpoint"' EXIT
          plist="$mountpoint/AJCollector.app/Contents/Info.plist"
          plutil -lint "$plist"
          test -n "$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$plist")"
          test -x "$mountpoint/AJCollector.app/Contents/MacOS/AJCollector"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/assets/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1

  flatpak:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, goarch: amd64, package-arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: aarch64, goarch: arm64, package-arch: aarch64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Flatpak builder and window system headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build binary and Flatpak bundle
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
          FLATPAK_ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package-arch }}
        run: |
          set -euo pipefail
          bash packaging/package.sh
          release_date="$(date -u +%F)"
          sed -i -E "s|<release version=\"[^\"]+\" type=\"stable\" date=\"[^\"]+\"/>|<release version=\"${VERSION#v}\" type=\"stable\" date=\"$release_date\"/>|" \
            flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml
          flatpak-builder \
            --arch="$FLATPAK_ARCH" \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=dist/flatpak-repo \
            --default-branch=stable \
            dist/flatpak-build \
            flatpak/io.github.applejuicenetz.collector.yaml
          flatpak build-bundle \
            --arch="$FLATPAK_ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            dist/flatpak-repo \
            "dist/AJCollector-linux-${PACKAGE_ARCH}.flatpak" \
            io.github.applejuicenetz.collector stable
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.package-arch }}
          path: dist/AJCollector-linux-${{ matrix.package-arch }}.flatpak
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [package, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          merge-multiple: true
          path: dist
      - name: Check all six packages
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            AJCollector-macos-amd64.dmg \
            AJCollector-macos-aarch64.dmg \
            AJCollector-windows-amd64.exe \
            AJCollector-windows-aarch64.exe \
            AJCollector-linux-amd64.flatpak \
            AJCollector-linux-aarch64.flatpak; do
            test -s "dist/$file"
          done
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: aktuelles Changelog befindet sich [hier](https://github.com/applejuicenetz/collector/blob/${{ github.ref_name }}/CHANGELOG.md#changelog)
          fail_on_unmatched_files: true
          files: |
            dist/AJCollector-macos-amd64.dmg
            dist/AJCollector-macos-aarch64.dmg
            dist/AJCollector-windows-amd64.exe
            dist/AJCollector-windows-aarch64.exe
            dist/AJCollector-linux-amd64.flatpak
            dist/AJCollector-linux-aarch64.flatpak

  update-main:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Commit released version to main
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          meta=flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::warning::Release commit is not on main; skipping version update"
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- "$meta"; then
            echo "::warning::Release metadata changed on main since this tag; skipping version update"
            exit 0
          fi
          sed -i -E "s|<release version=\"[^\"]+\" type=\"stable\" date=\"[^\"]+\"/>|<release version=\"$version\" type=\"stable\" date=\"$(date -u +%F)\"/>|" "$meta"
          if git diff --quiet -- "$meta"; then
            echo "main already contains version $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$meta"
          git commit -m "Release $version"
          git push origin HEAD:main

  notify-flatpak:
    needs: release
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger flatpak repository sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_DISPATCH_TOKEN }}
        run: gh api repos/applejuicenetz/flatpak/dispatches -f event_type=flatpak-release
