name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: amd64
            type: dmg
          - runner: macos-15
            platform: macos
            arch: aarch64
            type: dmg
          - runner: windows-2025
            platform: windows
            arch: amd64
            type: exe
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
            type: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - uses: actions/setup-dotnet@v6
        if: matrix.platform == 'windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX for jpackage
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build JAR and native installer
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_TYPE: ${{ matrix.type }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          fi
          mvn -B package
          version="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p target/jpackage-input target/jpackage-output
          cp target/AJCollector.jar target/jpackage-input/
          options=(
            --type "$PACKAGE_TYPE"
            --name AJCollector
            --app-version "$version"
            --vendor appleJuiceNETZ
            --input target/jpackage-input
            --main-jar AJCollector.jar
            --main-class de.applejuicenet.collector.Runner
            --add-modules java.desktop,java.management,java.naming,java.sql,java.xml,jdk.crypto.ec,jdk.unsupported
            --java-options --enable-native-access=ALL-UNNAMED
            --dest target/jpackage-output
          )
          if [[ "$PACKAGE_PLATFORM" == macos ]]; then
            options+=(--icon assets/mac/AJCollector.icns --mac-package-identifier de.applejuicenet.collector)
          else
            options+=(--icon assets/windows/AJCollector.ico --win-menu)
          fi
          jpackage "${options[@]}"
          mv "target/jpackage-output/AJCollector-${version}.${PACKAGE_TYPE}" "target/AJCollector-${PACKAGE_PLATFORM}-${PACKAGE_ARCH}.${PACKAGE_TYPE}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/AJCollector-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.type }}
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            package-arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            package-arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - name: Install Flatpak builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build JAR and Flatpak bundle
        shell: bash
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package-arch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          fi
          mvn -B package
          version="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          release_date="$(date -u +%F)"
          sed -i -E "s|<release version=\"[^\"]+\" type=\"stable\" date=\"[^\"]+\"/>|<release version=\"$version\" type=\"stable\" date=\"$release_date\"/>|" \
            flatpak/collector/io.github.applejuicenetz.collector.metainfo.xml
          flatpak-builder \
            --arch="$FLATPAK_ARCH" \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=target/flatpak-repo \
            --default-branch=stable \
            target/flatpak-build \
            flatpak/io.github.applejuicenetz.collector.yaml
          flatpak build-bundle \
            --arch="$FLATPAK_ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            target/flatpak-repo \
            "target/AJCollector-linux-${PACKAGE_ARCH}.flatpak" \
            io.github.applejuicenetz.collector stable
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.package-arch }}
          path: target/AJCollector-linux-${{ matrix.package-arch }}.flatpak
          if-no-files-found: error

  release:
    needs: [package, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          merge-multiple: true
          path: target
      - uses: actions/download-artifact@v7
        with:
          pattern: flatpak-*
          merge-multiple: true
          path: target
      - name: Check all six packages
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            AJCollector-macos-amd64.dmg \
            AJCollector-macos-aarch64.dmg \
            AJCollector-windows-amd64.exe \
            AJCollector-windows-aarch64.exe \
            AJCollector-linux-amd64.flatpak \
            AJCollector-linux-aarch64.flatpak; do
            test -s "target/$file"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: AJCollector-packages
          path: |
            target/*.dmg
            target/*.exe
            target/*.flatpak
          if-no-files-found: error
      - name: Publish JAR to GitHub Packages
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
          mvn -B deploy
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/AJCollector.jar
            target/AJCollector-macos-amd64.dmg
            target/AJCollector-macos-aarch64.dmg
            target/AJCollector-windows-amd64.exe
            target/AJCollector-windows-aarch64.exe
            target/AJCollector-linux-amd64.flatpak
            target/AJCollector-linux-aarch64.flatpak
